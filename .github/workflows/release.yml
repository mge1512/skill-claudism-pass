# Build the packaged .skill on a version tag and attach it to the release.
# The repository tree stays unpacked; this produces the archive that the
# claude.ai upload path needs.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build claudism-pass.skill
        run: |
          mkdir -p build/claudism-pass
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            ./ build/claudism-pass/
          (cd build && zip -q -r ../claudism-pass.skill claudism-pass)
          unzip -l claudism-pass.skill

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" claudism-pass.skill \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
